<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Relationship Cues — Card Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #121212;
    font-family: 'Poppins', -apple-system, Roboto, 'Segoe UI', sans-serif;
    color: #fff;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    max-width: 480px;
    height: 100dvh;
    margin: 0 auto;
    padding: 12px;
    padding-bottom: 0;
    overflow: hidden;
  }
  h1 {
    font-size: 15px;
    text-align: center;
    margin: 0 0 8px;
    font-weight: 600;
    color: #eee;
    letter-spacing: 0.5px;
    flex: 0 0 auto;
  }
  .canvas-container {
    position: relative;
    flex: 0 0 auto;
    width: auto;
    height: 42vh;
    max-height: 380px;
    max-width: 100%;
    aspect-ratio: 4 / 5;
    margin: 0 auto;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    touch-action: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  canvas#card {
    width: 100%;
    height: 100%;
    display: block;
  }
  .placeholder-btn {
    position: absolute;
    left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #888;
    font-size: 14px;
    pointer-events: none;
    text-align: center;
    padding: 0 20px;
  }
  .divider {
    position: absolute;
    left: 0; right: 0;
    height: 32px;
    margin-top: -16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: ns-resize;
    z-index: 5;
  }
  .divider .bar {
    width: 50px;
    height: 6px;
    background: #4CAF50;
    border-radius: 3px;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.35);
  }
  .hint {
    font-size: 12px;
    color: #777;
    text-align: center;
    margin-top: 6px;
    flex: 0 0 auto;
  }
  .controls {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 24px;
  }
  .row { display: flex; gap: 10px; }
  button {
    flex: 1;
    background: #2b2b2b;
    color: #fff;
    border: 1px solid #3a3a3a;
    border-radius: 10px;
    padding: 13px 10px;
    font-size: 14px;
    font-weight: 600;
  }
  button:active { background: #3a3a3a; }
  button.primary { background: #4CAF50; border-color: #4CAF50; }
  button.primary:active { background: #43a047; }
  #saveVideoBtn { background: #1565C0; border-color: #1565C0; }
  #saveVideoBtn:active { background: #0D47A1; }
  #saveVideoBtn:disabled { background: #2b2b2b; border-color: #3a3a3a; }
  textarea {
    width: 100%;
    background: #1c1c1c;
    color: #fff;
    border: 1px solid #3a3a3a;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    font-family: 'Poppins', sans-serif;
    text-transform: uppercase;
    resize: none;
    min-height: 70px;
  }
  label.small {
    font-size: 13px;
    color: #aaa;
    display: flex;
    justify-content: space-between;
  }
  input[type=range] { width: 100%; }
  #videoInput { display: none; }

  .swatchRow {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .swatch {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 3px solid transparent;
    padding: 0;
    flex: 0 0 auto;
    position: relative;
    box-shadow: 0 0 0 1px #3a3a3a;
  }
  .swatch.selected {
    border-color: #4CAF50;
    box-shadow: 0 0 0 1px #4CAF50;
  }
  .toggleRow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #1c1c1c;
    border: 1px solid #3a3a3a;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 600;
    color: #eee;
  }
  .toggleRow input[type=checkbox] {
    width: 20px;
    height: 20px;
    accent-color: #4CAF50;
  }
  button:disabled {
    opacity: 0.4;
  }
  .colorPickBtn {
    flex: 1;
    background: #2b2b2b;
    color: #fff;
    border: 1px solid #3a3a3a;
    border-radius: 10px;
    padding: 13px 10px;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
  }
  .colorPickBtn input[type=color] {
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 6px;
    padding: 0;
    background: none;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Relationship Cues — Card Maker</h1>

  <div class="canvas-container" id="canvasContainer">
    <canvas id="card" width="1080" height="1350"></canvas>
    <div class="placeholder-btn" id="placeholderHint">Select a video below</div>
    <div class="divider" id="divider"><div class="bar"></div></div>
  </div>
  <div class="hint">📌 Drag the cover to reposition · use "Zoom" to crop tighter · use "Cover Frame" to pick a moment from the video · tap a word in the text to highlight it</div>

  <div class="controls">
    <div class="toggleRow">
      <span>🔤 Full Text Card (no video)</span>
      <input type="checkbox" id="fullTextToggle" />
    </div>

    <div class="row">
      <button id="pickVideoBtn">🎥 Select Video</button>
    </div>
    <div class="row">
      <button id="saveBtn" class="primary">🖼️ Save PNG</button>
      <button id="saveVideoBtn" class="primary" disabled>🎬 Save Video</button>
    </div>
    <input type="file" id="videoInput" accept="video/*" />
    <video id="videoSource" playsinline muted style="display:none;"></video>
    <canvas id="coverCaptureCanvas" style="display:none;"></canvas>

    <label class="small" id="coverFrameRow" style="display:none;">🎬 Cover Frame <span id="coverTimeVal">0.0</span>s
      <input type="range" id="coverScrubber" min="0" max="1" step="0.05" value="0" />
    </label>

    <label class="small">Colour Style</label>
    <div class="swatchRow" id="swatchRow"></div>

    <div class="row" id="fullTextExtras" style="display:none;">
      <button id="randomGradientBtn">🎨 Random Gradient</button>
      <label class="colorPickBtn" for="bgColorPicker">🖌️ Pick Colour
        <input type="color" id="bgColorPicker" value="#4CAF50" />
      </label>
    </div>

    <textarea id="factText" placeholder="Type your text here..."></textarea>

    <label class="small">Font Size <span id="fontSizeVal">56</span>px
      <input type="range" id="fontSize" min="28" max="150" value="56" />
    </label>

    <label class="small">Cover Zoom / Crop <span id="zoomVal">100</span>%
      <input type="range" id="zoom" min="100" max="300" value="100" />
    </label>

    <div class="hint">Saved image goes to your "Downloads" folder</div>
  </div>
</div>

<script>
  const canvas = document.getElementById('card');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('canvasContainer');
  const divider = document.getElementById('divider');
  const placeholderHint = document.getElementById('placeholderHint');
  const factText = document.getElementById('factText');
  const fontSizeInput = document.getElementById('fontSize');
  const fontSizeVal = document.getElementById('fontSizeVal');
  const zoomInput = document.getElementById('zoom');
  const zoomVal = document.getElementById('zoomVal');
  const videoInput = document.getElementById('videoInput');
  const videoSource = document.getElementById('videoSource');
  const coverCaptureCanvas = document.getElementById('coverCaptureCanvas');
  const coverCtx = coverCaptureCanvas.getContext('2d');
  const coverFrameRow = document.getElementById('coverFrameRow');
  const coverScrubber = document.getElementById('coverScrubber');
  const coverTimeVal = document.getElementById('coverTimeVal');
  const fullTextToggle = document.getElementById('fullTextToggle');
  const pickVideoBtn = document.getElementById('pickVideoBtn');
  const saveVideoBtn = document.getElementById('saveVideoBtn');

  // When true, drawCard() paints the live video frame instead of the
  // static captured cover — used only while recording a video export.
  let liveVideoMode = false;
  const swatchRow = document.getElementById('swatchRow');
  const fullTextExtras = document.getElementById('fullTextExtras');
  const randomGradientBtn = document.getElementById('randomGradientBtn');
  const bgColorPicker = document.getElementById('bgColorPicker');

  // Canvas is 4:5 (width:height) — TEXT area on TOP, IMAGE area on BOTTOM
  const SIZE_W = 1080;
  const SIZE_H = 1350;
  const FONT_STACK = '"Anton", "Poppins", Arial, sans-serif';
  const WATERMARK_TEXT = 'RELATIONSHIP CUES';

  // Selectable text/background colour combinations. `highlight` is the colour
  // a tapped word turns — chosen per combo so it still stands out.
  const COMBOS = [
    { bg: '#FFFFFF', text: '#000000', highlight: '#E53935', name: 'White' },
    { bg: '#000000', text: '#FFFFFF', highlight: '#FFD54F', name: 'Black' },
    { bg: '#F5D400', text: '#000000', highlight: '#D32F2F', name: 'Yellow' },
    { bg: '#D32F2F', text: '#FFFFFF', highlight: '#FFEB3B', name: 'Red' },
    { bg: '#1B5E20', text: '#FFFFFF', highlight: '#FFD54F', name: 'Green' },
    { bg: '#0D1B4C', text: '#FFFFFF', highlight: '#FFD54F', name: 'Navy' },
    { bg: '#F8BBD0', text: '#000000', highlight: '#AD1457', name: 'Pink' },
    { bg: '#4A148C', text: '#FFFFFF', highlight: '#FFEB3B', name: 'Purple' },
    { bg: '#FB8C00', text: '#000000', highlight: '#FFFFFF', name: 'Orange' },
    { bg: '#00695C', text: '#FFFFFF', highlight: '#FFD54F', name: 'Teal' },
    { bg: '#5D1049', text: '#FFFFFF', highlight: '#FFD54F', name: 'Maroon' },
    { bg: '#C8E6C9', text: '#000000', highlight: '#2E7D32', name: 'Mint' },
    { bg: '#81D4FA', text: '#000000', highlight: '#0D47A1', name: 'Sky Blue' },
    { bg: '#2C2C2C', text: '#FFFFFF', highlight: '#FF7043', name: 'Charcoal' },
  ];

  let state = {
    image: null,
    fullText: false, // when true, no image is needed and text fills the whole card
    comboIndex: 0,    // which COMBOS entry is active
    customBg: null,   // { bgColors: [hex] or [hex,hex], text, highlight } — Full Text mode only
    textRatio: 0.32,   // fraction of height given to the TEXT area (top)
    fontSize: 56,
    text: factText.value,
    zoom: 1,          // 1 = fully fit, higher = zoomed in / more cropped
    centerX: null,    // center point of the crop window, in source-image pixels
    centerY: null,
    cropW: null,
    cropH: null,
    redWords: new Set(), // indices (into the current word list) of words tapped to highlight
    wordBoxes: []         // hit-test boxes for each drawn word, rebuilt every drawCard()
  };

  // Returns { bgColors: [hex] or [hex,hex], text, highlight }. In Full Text
  // mode a custom (gradient or manually picked) background takes priority.
  function currentCombo() {
    if (state.fullText && state.customBg) return state.customBg;
    const preset = COMBOS[state.comboIndex];
    return { bgColors: [preset.bg], text: preset.text, highlight: preset.highlight };
  }

  function luminance(hex) {
    const c = hex.replace('#', '');
    const r = parseInt(c.substring(0, 2), 16);
    const g = parseInt(c.substring(2, 4), 16);
    const b = parseInt(c.substring(4, 6), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  }
  function isLightColor(hex) { return luminance(hex) > 0.6; }
  function avgIsLight(colors) {
    return (colors.reduce((s, c) => s + luminance(c), 0) / colors.length) > 0.6;
  }

  function hexToRgba(hex, alpha) {
    const c = hex.replace('#', '');
    const r = parseInt(c.substring(0, 2), 16);
    const g = parseInt(c.substring(2, 4), 16);
    const b = parseInt(c.substring(4, 6), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  // Builds a solid or (2-colour) gradient fillStyle from a bgColors array.
  function bgFillStyle(colors, alpha) {
    if (alpha === undefined) alpha = 1;
    if (colors.length === 1) return hexToRgba(colors[0], alpha);
    const grad = ctx.createLinearGradient(0, 0, SIZE_W, SIZE_H);
    grad.addColorStop(0, hexToRgba(colors[0], alpha));
    grad.addColorStop(1, hexToRgba(colors[1], alpha));
    return grad;
  }

  // Auto-picks readable text/highlight colours for a custom background.
  function contrastFor(colors) {
    const dark = !avgIsLight(colors);
    return { text: dark ? '#FFFFFF' : '#000000', highlight: dark ? '#FFD54F' : '#D32F2F' };
  }

  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
    return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
  }

  // A fresh, reasonably pleasant random 2-colour gradient each time it's called.
  function randomGradientColors() {
    const h1 = Math.floor(Math.random() * 360);
    const h2 = (h1 + 40 + Math.floor(Math.random() * 120)) % 360;
    const s = 65 + Math.floor(Math.random() * 20);
    const l = 42 + Math.floor(Math.random() * 16);
    return [hslToHex(h1, s, l), hslToHex(h2, s, l)];
  }

  function buildSwatches() {
    swatchRow.innerHTML = '';
    COMBOS.forEach((combo, i) => {
      const btn = document.createElement('button');
      const usingCustom = state.fullText && state.customBg;
      btn.className = 'swatch' + (!usingCustom && i === state.comboIndex ? ' selected' : '');
      btn.style.background = combo.bg;
      btn.title = combo.name;
      btn.addEventListener('click', () => {
        state.comboIndex = i;
        state.customBg = null; // preset overrides any gradient/manual colour
        buildSwatches();
        drawCard();
      });
      swatchRow.appendChild(btn);
    });
  }
  buildSwatches();

  function layoutLines(context, wordObjs, maxWidth) {
    const spaceWidth = context.measureText(' ').width;
    const lines = [];
    let currentLine = [];
    let currentWidth = 0;
    wordObjs.forEach(({ word, idx }) => {
      const w = context.measureText(word).width;
      const addWidth = currentLine.length ? spaceWidth + w : w;
      if (currentWidth + addWidth > maxWidth && currentLine.length) {
        lines.push(currentLine);
        currentLine = [{ word, idx, width: w }];
        currentWidth = w;
      } else {
        currentLine.push({ word, idx, width: w });
        currentWidth += addWidth;
      }
    });
    if (currentLine.length) lines.push(currentLine);
    return lines;
  }

  // Returns { src, width, height } for whatever should currently be drawn —
  // the live <video> element while recording (liveVideoMode), otherwise the
  // static captured cover canvas. Keeping both paths returning the same
  // shape means the crop/zoom math below never needs to know which one it got.
  function activeMediaSource() {
    if (liveVideoMode && videoSource.videoWidth && videoSource.videoHeight) {
      return { src: videoSource, width: videoSource.videoWidth, height: videoSource.videoHeight };
    }
    if (state.image) {
      return { src: state.image, width: state.image.width, height: state.image.height };
    }
    return null;
  }

  // Draws `media` ({src,width,height}) blurred, covering the whole card (used
  // as a Full Text mode background). Drawn slightly oversized so blur edge
  // softening stays off-canvas.
  function drawFullTextBackgroundImage(media, blurPx) {
    const margin = 40;
    const targetW = SIZE_W + margin * 2;
    const targetH = SIZE_H + margin * 2;
    const targetRatio = targetW / targetH;
    const imgRatio = media.width / media.height;
    let baseW, baseH;
    if (imgRatio > targetRatio) { baseH = media.height; baseW = baseH * targetRatio; }
    else { baseW = media.width; baseH = baseW / targetRatio; }
    const cropX = (media.width - baseW) / 2;
    const cropY = (media.height - baseH) / 2;
    ctx.save();
    ctx.filter = `blur(${blurPx}px)`;
    ctx.drawImage(media.src, cropX, cropY, baseW, baseH, -margin, -margin, targetW, targetH);
    ctx.restore();
  }

  function drawCard() {
    ctx.clearRect(0, 0, SIZE_W, SIZE_H);
    const combo = currentCombo();
    const splitY = state.fullText ? SIZE_H : Math.round(SIZE_H * state.textRatio);
    const media = activeMediaSource();

    // ---- BACKGROUND — full canvas in Full Text mode, top area otherwise ----
    if (state.fullText && media) {
      // Blurred photo behind the text, tinted with the chosen colour so text stays readable
      drawFullTextBackgroundImage(media, 22);
      ctx.fillStyle = bgFillStyle(combo.bgColors, 0.55);
      ctx.fillRect(0, 0, SIZE_W, SIZE_H);
    } else {
      ctx.fillStyle = bgFillStyle(combo.bgColors);
      ctx.fillRect(0, 0, SIZE_W, splitY);
    }

    const paddingX = 60;
    const maxWidth = SIZE_W - paddingX * 2;
    ctx.font = `400 ${state.fontSize}px ${FONT_STACK}`;
    ctx.textBaseline = 'middle';

    const paragraphs = (state.text || '').split(/\n/);
    let globalIdx = 0;
    const lines = [];
    paragraphs.forEach(para => {
      const paraWords = para.toUpperCase().split(/\s+/).filter(Boolean);
      if (paraWords.length === 0) {
        lines.push([]); // preserve an intentional blank line
        return;
      }
      const wordObjs = paraWords.map(word => ({ word, idx: globalIdx++ }));
      layoutLines(ctx, wordObjs, maxWidth).forEach(l => lines.push(l));
    });
    const spaceWidth = ctx.measureText(' ').width;
    const lineHeight = state.fontSize * 1.18;
    const totalTextHeight = lines.length * lineHeight;
    const textAreaCenterY = splitY / 2;
    let startY = textAreaCenterY - totalTextHeight / 2 + lineHeight / 2;

    state.wordBoxes = [];
    ctx.textAlign = 'left';
    lines.forEach((lineWords, i) => {
      const lineWidth = lineWords.reduce((sum, w) => sum + w.width, 0) + spaceWidth * (lineWords.length - 1);
      let x = SIZE_W / 2 - lineWidth / 2;
      const y = startY + i * lineHeight;
      lineWords.forEach(w => {
        ctx.fillStyle = state.redWords.has(w.idx) ? combo.highlight : combo.text;
        ctx.fillText(w.word, x, y);
        state.wordBoxes.push({
          idx: w.idx,
          x0: x,
          y0: y - state.fontSize / 2,
          x1: x + w.width,
          y1: y + state.fontSize / 2
        });
        x += w.width + spaceWidth;
      });
    });

    // ---- IMAGE AREA (bottom) — skipped entirely in Full Text mode ----
    if (!state.fullText) {
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, splitY, SIZE_W, SIZE_H - splitY);

    if (media) {
      const targetW = SIZE_W, targetH = SIZE_H - splitY;
      const targetRatio = targetW / targetH;
      const imgRatio = media.width / media.height;

      let baseW, baseH;
      if (imgRatio > targetRatio) { baseH = media.height; baseW = baseH * targetRatio; }
      else { baseW = media.width; baseH = baseW / targetRatio; }

      const cropW = baseW / state.zoom;
      const cropH = baseH / state.zoom;

      state.centerX = Math.max(cropW / 2, Math.min(state.centerX, media.width - cropW / 2));
      state.centerY = Math.max(cropH / 2, Math.min(state.centerY, media.height - cropH / 2));

      const cropX = state.centerX - cropW / 2;
      const cropY = state.centerY - cropH / 2;

      state.cropW = cropW;
      state.cropH = cropH;

      ctx.drawImage(media.src, cropX, cropY, cropW, cropH, 0, splitY, targetW, targetH);
    }
    } // end image-area (!state.fullText)

    // ---- WATERMARK — colour adapts so it stays readable on any background ----
    // On a photo (normal mode) we always assume it's dark-ish and use light text
    // with a dark scrim. In Full Text mode the "background" is the chosen combo
    // colour, so we pick light/dark watermark styling based on its brightness.
    const wmOnLightBg = state.fullText && avgIsLight(combo.bgColors);
    ctx.save();

    if (!state.fullText) {
      const scrimH = 130;
      const scrimGrad = ctx.createLinearGradient(0, SIZE_H - scrimH, 0, SIZE_H);
      scrimGrad.addColorStop(0, 'rgba(0,0,0,0)');
      scrimGrad.addColorStop(1, 'rgba(0,0,0,0.38)');
      ctx.fillStyle = scrimGrad;
      ctx.fillRect(0, SIZE_H - scrimH, SIZE_W, scrimH);
    }

    const wmLineColor = wmOnLightBg ? 'rgba(0,0,0,0.45)' : 'rgba(255,255,255,0.55)';
    const wmTextColor = wmOnLightBg ? 'rgba(0,0,0,0.85)' : 'rgba(255,255,255,0.92)';

    // thin center rule above the wordmark
    ctx.strokeStyle = wmLineColor;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(SIZE_W / 2 - 22, SIZE_H - 46);
    ctx.lineTo(SIZE_W / 2 + 22, SIZE_H - 46);
    ctx.stroke();

    ctx.font = `600 20px "Poppins", Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = wmTextColor;
    ctx.letterSpacing = '5px';
    ctx.fillText(WATERMARK_TEXT, SIZE_W / 2 + 2, SIZE_H - 26);
    ctx.restore();

    const displayRatio = container.clientHeight / SIZE_H;
    divider.style.display = state.fullText ? 'none' : 'flex';
    divider.style.top = (splitY * displayRatio) + 'px';
    placeholderHint.style.top = (splitY * displayRatio) + 'px';
    placeholderHint.style.height = ((SIZE_H - splitY) * displayRatio) + 'px';
    placeholderHint.style.display = (state.image || state.fullText) ? 'none' : 'flex';
  }

  let dragging = false;
  function ratioFromClientY(clientY) {
    const rect = container.getBoundingClientRect();
    let ratio = (clientY - rect.top) / rect.height;
    return Math.max(0.15, Math.min(0.6, ratio));
  }
  divider.addEventListener('pointerdown', (e) => {
    dragging = true;
    divider.setPointerCapture(e.pointerId);
  });
  divider.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    state.textRatio = ratioFromClientY(e.clientY);
    drawCard();
  });
  divider.addEventListener('pointerup', () => { dragging = false; });
  divider.addEventListener('pointercancel', () => { dragging = false; });

  // ---- Move/reposition the image by dragging it (image area is now the BOTTOM part) ----
  let imgDragging = false;
  let lastX = 0, lastY = 0;

  canvas.addEventListener('pointerdown', (e) => {
    if (!state.image || state.fullText) return;
    const rect = container.getBoundingClientRect();
    const splitYDisplay = rect.top + rect.height * state.textRatio;
    if (e.clientY < splitYDisplay) return; // only drag within the image area (bottom), not the text area
    imgDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!imgDragging || !state.image) return;
    const rect = container.getBoundingClientRect();
    const dxDisplay = e.clientX - lastX;
    const dyDisplay = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;

    const displayImageHeight = rect.height * (1 - state.textRatio);
    const scaleFactorX = state.cropW / rect.width;
    const scaleFactorY = state.cropH / displayImageHeight;

    state.centerX -= dxDisplay * scaleFactorX;
    state.centerY -= dyDisplay * scaleFactorY;

    drawCard();
  });

  // ---- Tap a word in the TEXT area to toggle its highlight colour ----
  canvas.addEventListener('click', (e) => {
    if (!state.text) return;
    const rect = container.getBoundingClientRect();
    const textRatioEffective = state.fullText ? 1 : state.textRatio;
    const splitYDisplay = rect.top + rect.height * textRatioEffective;
    if (e.clientY >= splitYDisplay) return; // only handle taps inside the text area (top)

    const canvasX = (e.clientX - rect.left) / rect.width * SIZE_W;
    const canvasY = (e.clientY - rect.top) / rect.height * SIZE_H;

    const hit = state.wordBoxes.find(b =>
      canvasX >= b.x0 && canvasX <= b.x1 && canvasY >= b.y0 && canvasY <= b.y1
    );
    if (!hit) return;

    if (state.redWords.has(hit.idx)) state.redWords.delete(hit.idx);
    else state.redWords.add(hit.idx);
    drawCard();
  });

  canvas.addEventListener('pointerup', (e) => {
    imgDragging = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointercancel', () => { imgDragging = false; });

  pickVideoBtn.addEventListener('click', () => {
    videoInput.click();
  });

  fullTextToggle.addEventListener('change', () => {
    state.fullText = fullTextToggle.checked;
    fullTextExtras.style.display = state.fullText ? 'flex' : 'none';
    drawCard();
  });

  randomGradientBtn.addEventListener('click', () => {
    const [c1, c2] = randomGradientColors();
    const contrast = contrastFor([c1, c2]);
    state.customBg = { bgColors: [c1, c2], text: contrast.text, highlight: contrast.highlight };
    buildSwatches();
    drawCard();
  });

  bgColorPicker.addEventListener('input', () => {
    const c = bgColorPicker.value;
    const contrast = contrastFor([c]);
    state.customBg = { bgColors: [c], text: contrast.text, highlight: contrast.highlight };
    buildSwatches();
    drawCard();
  });

  // ---- Video select → pick a cover frame from it ----
  // The final card is a still image, so instead of an image file we let the
  // user pick a video and grab whichever frame they like as the "cover"
  // (drawn onto an offscreen canvas). Everything downstream — zoom, drag to
  // reposition, crop — works exactly as it did with a static image, because
  // a <canvas> behaves the same as an <img> for ctx.drawImage() and has the
  // same .width/.height.
  let currentVideoURL = null;
  let pendingReset = false;

  function captureCoverFrame(resetView) {
    if (!videoSource.videoWidth || !videoSource.videoHeight) return;
    coverCaptureCanvas.width = videoSource.videoWidth;
    coverCaptureCanvas.height = videoSource.videoHeight;
    coverCtx.drawImage(videoSource, 0, 0, coverCaptureCanvas.width, coverCaptureCanvas.height);
    state.image = coverCaptureCanvas;
    if (resetView) {
      state.zoom = 1;
      state.centerX = coverCaptureCanvas.width / 2;
      state.centerY = coverCaptureCanvas.height / 2;
      zoomInput.value = 100;
      zoomVal.textContent = 100;
    }
    drawCard();
  }

  videoInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (currentVideoURL) URL.revokeObjectURL(currentVideoURL);
    currentVideoURL = URL.createObjectURL(file);
    pendingReset = true;
    videoSource.src = currentVideoURL;
    videoSource.load();
  });

  videoSource.addEventListener('loadedmetadata', () => {
    const dur = isFinite(videoSource.duration) && videoSource.duration > 0 ? videoSource.duration : 1;
    coverScrubber.min = 0;
    coverScrubber.max = dur;
    coverScrubber.step = Math.max(0.01, dur / 200);
    coverScrubber.value = 0;
    coverTimeVal.textContent = '0.0';
    coverFrameRow.style.display = 'flex';
    saveVideoBtn.disabled = false;
    // Seek to the first frame so a cover is captured immediately.
    videoSource.currentTime = 0;
  });

  videoSource.addEventListener('seeked', () => {
    captureCoverFrame(pendingReset);
    pendingReset = false;
  });

  coverScrubber.addEventListener('input', () => {
    coverTimeVal.textContent = parseFloat(coverScrubber.value).toFixed(1);
    videoSource.currentTime = parseFloat(coverScrubber.value);
  });

  factText.addEventListener('input', () => {
    state.text = factText.value;
    state.redWords.clear();
    drawCard();
  });
  fontSizeInput.addEventListener('input', () => {
    state.fontSize = parseInt(fontSizeInput.value, 10);
    fontSizeVal.textContent = state.fontSize;
    drawCard();
  });
  zoomInput.addEventListener('input', () => {
    state.zoom = parseInt(zoomInput.value, 10) / 100;
    zoomVal.textContent = zoomInput.value;
    drawCard();
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'RelationshipCues_' + Date.now() + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }, 'image/png');
  });

  // ---- Save Video: records the card WITH the video actually playing behind
  // the text/watermark, using canvas.captureStream() + MediaRecorder. Output
  // is .webm (or .mp4 where the browser supports recording it) since that's
  // what MediaRecorder can produce — there is no in-browser way to write a
  // classic .mp4/H.264 file without a much heavier encoding library. ----
  function pickRecorderMimeType() {
    const candidates = [
      'video/mp4;codecs=h264,aac',
      'video/mp4',
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm'
    ];
    return candidates.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || null;
  }

  saveVideoBtn.addEventListener('click', async () => {
    if (!videoSource.src || !isFinite(videoSource.duration) || videoSource.duration <= 0) {
      alert('Pehle ek video select karo.');
      return;
    }
    if (!window.MediaRecorder || !canvas.captureStream) {
      alert('Ye browser video recording support nahi karta. Chrome ya Safari (latest) try karo.');
      return;
    }
    const mimeType = pickRecorderMimeType();
    if (!mimeType) {
      alert('Ye browser koi supported video format record nahi kar pa raha.');
      return;
    }

    const resumeCoverTime = videoSource.currentTime;
    saveVideoBtn.disabled = true;
    pickVideoBtn.disabled = true;
    document.getElementById('saveBtn').disabled = true;
    saveVideoBtn.textContent = '⏳ Recording...';

    try {
      const fps = 30;
      const stream = canvas.captureStream(fps);

      // Try to carry the video's own audio track into the recording.
      try {
        if (videoSource.captureStream) {
          const vStream = videoSource.captureStream();
          vStream.getAudioTracks().forEach(t => stream.addTrack(t));
        }
      } catch (err) { /* no audio track available — silent export is fine */ }

      const chunks = [];
      const recorder = new MediaRecorder(stream, { mimeType });
      recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      const stopped = new Promise(resolve => { recorder.onstop = resolve; });

      liveVideoMode = true;
      videoSource.currentTime = 0;
      await new Promise(resolve => {
        const onSeeked = () => { videoSource.removeEventListener('seeked', onSeeked); resolve(); };
        videoSource.addEventListener('seeked', onSeeked);
      });

      await videoSource.play();
      recorder.start();

      await new Promise(resolve => {
        function frameLoop() {
          if (videoSource.paused || videoSource.ended) { resolve(); return; }
          drawCard();
          requestAnimationFrame(frameLoop);
        }
        requestAnimationFrame(frameLoop);
      });

      recorder.stop();
      await stopped;

      const blob = new Blob(chunks, { type: mimeType });
      const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'RelationshipCues_' + Date.now() + '.' + ext;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    } catch (err) {
      alert('Video record nahi ho payi: ' + err.message);
    } finally {
      videoSource.pause();
      liveVideoMode = false;
      videoSource.currentTime = resumeCoverTime;
      saveVideoBtn.disabled = false;
      pickVideoBtn.disabled = false;
      document.getElementById('saveBtn').disabled = false;
      saveVideoBtn.textContent = '🎬 Save Video';
    }
  });

  window.addEventListener('resize', drawCard);
  window.addEventListener('load', drawCard);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(drawCard);
  }
  drawCard();
</script>
</body>
</html>
